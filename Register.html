<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Expense Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./Register.js" defer></script>
  <style>
       .form-container {
      perspective: 1000px;
    }

    .form-card {
      position: relative;
      width: 100%;
      max-width: 400px;
      margin: auto;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55), box-shadow 0.4s ease;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
      border-radius: 15px;
    }

    
    .form-container:hover .form-card {
      transform: rotateY(-10deg) rotateX(5deg);
         box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    }

    .input-field {
      transition: all 0.3s ease;
    }

    .input-field:focus {
      box-shadow: 0 0 8px rgba(75, 85, 99, 0.6);
      transform: translateY(-5px);
    }

    .submit-button {
      transition: all 0.3s ease;
      background-color: #4f46e5;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
    }

    .submit-button:hover {
      transform: translateY(-5px);
      background-color: #4338ca;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
    }

    .submit-button, .input-field {
      border-radius: 12px;
    }

     .form-card .form-card-inner {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .form-card .form-card-back {
      transform: rotateY(180deg);
      background: #f3f4f6;
      padding: 20px;
      border-radius: 15px;
    }

    body {
      background-color: #f7fafc;
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-900 font-sans">

  <div class="flex justify-center items-center min-h-screen bg-gray-50 form-container">
    <div class="form-card">
      <div class="form-card-inner">
        <div class="bg-white p-10 w-full rounded-xl shadow-xl">
          <h1 class="text-4xl text-center text-indigo-600 mb-6">Create an Account</h1>

          <form id="register-form" class="space-y-6">

            <input type="text" id="name" placeholder="Full Name" required class="input-field w-full p-4 border border-gray-300 shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">

            
            <input type="email" id="email" placeholder="Email" required class="input-field w-full p-4 border border-gray-300 shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">

            <input type="password" id="password" placeholder="Password" required class="input-field w-full p-4 border border-gray-300 shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">


            <input type="password" id="confirm-password" placeholder="Confirm Password" required class="input-field w-full p-4 border border-gray-300 shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">

          
            <button type="submit" class="submit-button w-full p-4 text-white rounded-lg transform transition duration-500 hover:scale-105 focus:outline-none">Register</button>
          </form>

          
          <p class="text-center mt-6">
            <span class="text-gray-600">Already have an account? </span>
            <a href="Login.html" class="text-indigo-600 hover:underline">Login here</a>
          </p>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
